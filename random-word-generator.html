<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Random Word Generator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0d0d;
        --surface: #161818;
        --text: #f3f2ed;
        --muted: #a5a6a0;
        --line: #303333;
        --accent: #ff6849;
        --accent-hover: #ff7d62;
        --accent-text: #17100e;
        --focus: rgba(255, 104, 73, 0.3);
        --chip: #222525;
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      }

      @media (prefers-color-scheme: light) {
        :root {
          /* Keep the requested dark interface, with a slightly softer
             contrast curve on light-configured displays. */
          --bg: #111212;
          --surface: #1a1c1c;
          --text: #f5f4ef;
          --muted: #afb0aa;
          --line: #353838;
          --chip: #252828;
        }
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        margin: 0;
        min-width: 280px;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, select { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }

      .page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .generator {
        width: min(100%, 680px);
      }

      .word-stage {
        min-height: clamp(196px, 34vh, 290px);
        display: grid;
        place-items: center;
        text-align: center;
        padding: 42px 24px 34px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .word-wrap {
        min-width: 0;
        width: 100%;
      }

      .label {
        margin: 0 0 20px;
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.74rem;
        letter-spacing: 0.06em;
      }

      #word {
        margin: 0;
        font-size: clamp(2.8rem, 11vw, 6rem);
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -0.055em;
        overflow-wrap: anywhere;
      }

      #word.changed, #definition.changed { animation: word-in 240ms ease-out; }

      .definition {
        max-width: 520px;
        margin: 22px auto 0;
        color: var(--muted);
        font-size: clamp(0.94rem, 2vw, 1.05rem);
        line-height: 1.55;
      }

      .part-of-speech {
        margin-right: 0.45em;
        color: var(--accent);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.78em;
        font-style: italic;
      }

      @keyframes word-in {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
        gap: 10px;
        padding-top: 18px;
      }

      .field {
        position: relative;
        min-width: 0;
      }

      .field-label {
        position: absolute;
        top: 9px;
        left: 14px;
        z-index: 1;
        color: var(--muted);
        font-size: 0.68rem;
        line-height: 1;
        pointer-events: none;
      }

      select {
        width: 100%;
        min-height: 58px;
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px 38px 8px 13px;
        background-color: var(--surface);
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 17px) 27px, calc(100% - 12px) 27px;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        color: var(--text);
        font-weight: 500;
        outline: none;
      }

      select:focus-visible, button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .generate {
        min-height: 58px;
        border: 0;
        border-radius: 8px;
        padding: 0 24px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        cursor: pointer;
        transition: background 150ms ease, transform 100ms ease;
      }

      .generate:hover { background: var(--accent-hover); }
      .generate:active { transform: translateY(1px); }

      .utility {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 15px;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
      }

      .copy {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 0;
        padding: 8px 2px 8px 10px;
        background: transparent;
        color: var(--muted);
        font-size: 0.8rem;
        cursor: pointer;
      }

      .copy:hover { color: var(--text); }
      .copy svg { width: 16px; height: 16px; stroke: currentColor; }

      .recent {
        display: none;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding-top: 24px;
      }

      .recent.visible { display: flex; }

      .recent-title {
        margin-right: 4px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .recent-word {
        border: 0;
        border-radius: 999px;
        padding: 7px 11px;
        background: var(--chip);
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        cursor: pointer;
      }

      .recent-word:hover { color: var(--text); }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        z-index: 10;
        transform: translate(-50%, 12px);
        padding: 10px 14px;
        border-radius: 6px;
        background: var(--text);
        color: var(--bg);
        font-size: 0.8rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease, transform 160ms ease;
        box-shadow: var(--shadow);
      }

      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 560px) {
        .page { place-items: start center; padding-top: max(56px, env(safe-area-inset-top)); }
        .word-stage { min-height: 230px; padding-inline: 8px; }
        #word { font-size: clamp(2.65rem, 15vw, 4.5rem); }
        .controls { grid-template-columns: 1fr 1fr; }
        .generate { grid-column: 1 / -1; }
        .utility { padding-top: 12px; }
        .hint { display: none; }
        .copy { margin-left: auto; }
      }

      @media (max-width: 350px) {
        .controls { grid-template-columns: 1fr; }
        .generate { grid-column: auto; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="generator" aria-label="Random word generator">
        <div class="word-stage" aria-live="polite" aria-atomic="true">
          <div class="word-wrap">
            <p class="label">Your random word</p>
            <h1 id="word">serendipity</h1>
            <p class="definition" id="definition"><span class="part-of-speech">noun</span>The chance discovery of something valuable or delightful.</p>
          </div>
        </div>

        <div class="controls" aria-label="Word options">
          <label class="field">
            <span class="field-label">Category</span>
            <select id="category" aria-label="Word category">
              <option value="all">All words</option>
              <option value="noun">Nouns</option>
              <option value="verb">Verbs</option>
              <option value="adjective">Adjectives</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Length</span>
            <select id="length" aria-label="Word length">
              <option value="all">Any length</option>
              <option value="short">Short · 3–5</option>
              <option value="medium">Medium · 6–8</option>
              <option value="long">Long · 9+</option>
            </select>
          </label>
          <button class="generate" id="generate" type="button">New word</button>
        </div>

        <div class="utility">
          <p class="hint">Press space for another</p>
          <button class="copy" id="copy" type="button" aria-label="Copy current word">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="11" height="11" rx="2" stroke-width="1.8" />
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <span>Copy</span>
          </button>
        </div>

        <div class="recent" id="recent" aria-label="Recent words">
          <span class="recent-title">Recent</span>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">Copied</div>

        }

        generateEl.addEventListener("click", generate);
        copyEl.addEventListener("click", copyWord);
        categoryEl.addEventListener("change", generate);
        lengthEl.addEventListener("change", generate);
        document.addEventListener("keydown", function (event) {
          var tag = document.activeElement && document.activeElement.tagName;
          if (event.code === "Space" && tag !== "SELECT" && tag !== "BUTTON") {
            event.preventDefault();
            generate();
          }
        });
      }());
    </script>
  </body>
</html>
